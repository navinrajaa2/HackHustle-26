<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark Background -->
  <rect width="100" height="100" rx="16" fill="#0D0D14" />
  
  <!-- "SR" Text Centered -->
  <text x="50" y="55" font-family="'Courier New', Courier, serif" font-weight="900" font-size="46" fill="#F3F4F6" text-anchor="middle" dominant-baseline="central" letter-spacing="2">SR</text>
  
  <!-- Bottom Left Element (Hollow Node) -->
  <circle cx="16" cy="84" r="5" fill="#333" stroke="#F9C935" stroke-width="3" />
  <line x1="20" y1="80" x2="33" y2="67" stroke="#F9C935" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Top Right Element (Solid Node) -->
  <circle cx="84" cy="16" r="6" fill="#F9C935" />
  <line x1="79" y1="21" x2="66" y2="34" stroke="#F9C935" stroke-width="4.5" stroke-linecap="round" />
</svg>
